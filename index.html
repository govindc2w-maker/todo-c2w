<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link id="themeStylesheet" rel="stylesheet" href="index.css">
    <style>
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #00f3ff;
            box-shadow: 0 0 10px #00f3ff;
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        .theme-toggle-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>

    <div id="tech-controls"
        style="position: fixed; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999;">
        <button id="btnHtml" style="padding: 10px; cursor: pointer;">HTML</button>
        <button id="btnCss" style="padding: 10px; cursor: pointer;">CSS</button>
        <button id="btnJs" style="padding: 10px; cursor: pointer;">JAVASCRIPT</button>
    </div>

    <div class="app">

        <div class="theme-toggle-container">
            <span style="font-size: 0.9rem; opacity: 0.8; color: inherit;">Neon Theme</span>
            <label class="switch">
                <input type="checkbox" id="themeToggleCheckbox">
                <span class="slider"></span>
            </label>
        </div>

        <h1>My To-Do-List</h1>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a task...">

            <button id="addBtn">Add</button>
        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="index.js"></script>
       
    </script>
</body>

</html>
